name: Build MeyPlayer (Windows EXE + Android APK)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win nsis portable --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: MeyPlayer-Windows
          path: |
            dist/MeyPlayer-Setup-*.exe
            dist/MeyPlayer-Portable-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/mey.jks
            echo "MEY_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "MEY_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "MEY_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            echo "No keystore secret: generating a temporary signing key (fine for sideloading)."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/mey.jks -alias meyplayer -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass meyplayer -keypass meyplayer -dname "CN=MeyPlayer, O=MeyPlayer, C=MY"
            echo "MEY_KEYSTORE_PASSWORD=meyplayer" >> $GITHUB_ENV
            echo "MEY_KEY_ALIAS=meyplayer" >> $GITHUB_ENV
            echo "MEY_KEY_PASSWORD=meyplayer" >> $GITHUB_ENV
          fi
          echo "MEY_KEYSTORE=$RUNNER_TEMP/mey.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MeyPlayer-1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeyPlayer-Android
          path: MeyPlayer-1.2.0.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/MeyPlayer-Windows/*.exe
            out/MeyPlayer-Android/*.apk
